<!DOCTYPE html >
    <html lang="en">
        <head>
            <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>MoMA Art Collection</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
                        <link rel="stylesheet" href="css/styles.css">
                        </head>
                        <body>
                            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                                <div class="container">
                                    <a class="navbar-brand" href="#">
                                        <img src="https://www.moma.org/assets/moma-logo.svg" alt="MoMA Logo" height="30">
                                            Art Collection
                                    </a>
                                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                                        <span class="navbar-toggler-icon"></span>
                                    </button>
                                    <div class="collapse navbar-collapse" id="navbarNav">
                                        <ul class="navbar-nav ms-auto">
                                            <li class="nav-item">
                                                <a class="nav-link active" href="#">Browse</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#addArtworkModal">Add Artwork</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link" href="/about">About This Page</a>
                                            </li>
                                        </ul>
                                        <form class="d-flex ms-3" id="searchForm">
                                            <input class="form-control me-2" type="search" placeholder="Search artworks..." id="searchInput">
                                                <button class="btn btn-outline-light" type="submit">Search</button>
                                        </form>
                                    </div>
                                </div>
                            </nav>

                            <div class="container mt-4">
                                <h1 class="text-center mb-4">MoMA Art Collection</h1>

                                <div class="row mb-4">
                                    <div class="col-md-4">
                                        <div class="card">
                                            <div class="card-header bg-dark text-white">
                                                Explore Artworks
                                            </div>
                                            <div class="card-body">
                                                <div class="mb-3">
                                                    <label for="filterField" class="form-label">Filter by:</label>
                                                    <select class="form-select" id="filterField">
                                                        <option value="Title">Title</option>
                                                        <option value="Artist">Artist</option>
                                                        <option value="Year">Year</option>
                                                        <option value="Medium">Medium</option>
                                                    </select>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="filterValue" class="form-label">Value:</label>
                                                    <input type="text" class="form-control" id="filterValue" placeholder="Enter filter value">
                                                </div>
                                                <button class="btn btn-primary w-100" id="applyFilterBtn">Apply Filter</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-8">
                                        <div class="card">
                                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                                                <span>Current Artwork</span>
                                                <div>
                                                    <button class="btn btn-sm btn-outline-light" id="prevBtn">Previous</button>
                                                    <span class="mx-2" id="paginationInfo">1 of 10</span>
                                                    <button class="btn btn-sm btn-outline-light" id="nextBtn">Next</button>
                                                </div>
                                            </div>
                                            <div class="card-body" id="currentArtwork">
                                                <div class="text-center">
                                                    <div class="spinner-border" role="status">
                                                        <span class="visually-hidden">Loading...</span>
                                                    </div>
                                                    <p>Loading artwork...</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row" id="artworkGrid">
                                    <!-- Artwork cards will be loaded here -->
                                    <div class="col-12 text-center">
                                        <div class="spinner-border" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <p>Loading artworks...</p>
                                    </div>
                                </div>

                                <nav aria-label="Artwork pagination" class="mt-4">
                                    <ul class="pagination justify-content-center" id="pagination">
                                        <!-- Pagination will be generated here -->
                                    </ul>
                                </nav>
                            </div>

                            <!-- Add Artwork Modal -->
                            <div class="modal fade" id="addArtworkModal" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header bg-dark text-white">
                                            <h5 class="modal-title">Add New Artwork</h5>
                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <form id="addArtworkForm">
                                                <div class="mb-3">
                                                    <label for="artworkTitle" class="form-label">Title</label>
                                                    <input type="text" class="form-control" id="artworkTitle" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="artworkArtist" class="form-label">Artist</label>
                                                    <input type="text" class="form-control" id="artworkArtist" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="artworkYear" class="form-label">Year</label>
                                                    <input type="text" class="form-control" id="artworkYear" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="artworkMedium" class="form-label">Medium</label>
                                                    <input type="text" class="form-control" id="artworkMedium">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="artworkDimensions" class="form-label">Dimensions</label>
                                                    <input type="text" class="form-control" id="artworkDimensions">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="artworkImageURL" class="form-label">Image URL</label>
                                                    <input type="url" class="form-control" id="artworkImageURL">
                                                </div>
                                            </form>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="button" class="btn btn-primary" id="saveArtworkBtn">Save Artwork</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Edit Artwork Modal -->
                            <div class="modal fade" id="editArtworkModal" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header bg-dark text-white">
                                            <h5 class="modal-title">Edit Artwork</h5>
                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <form id="editArtworkForm">
                                                <input type="hidden" id="editArtworkId">
                                                    <div class="mb-3">
                                                        <label for="editArtworkTitle" class="form-label">Title</label>
                                                        <input type="text" class="form-control" id="editArtworkTitle" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="editArtworkArtist" class="form-label">Artist</label>
                                                        <input type="text" class="form-control" id="editArtworkArtist" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="editArtworkYear" class="form-label">Year</label>
                                                        <input type="text" class="form-control" id="editArtworkYear" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="editArtworkMedium" class="form-label">Medium</label>
                                                        <input type="text" class="form-control" id="editArtworkMedium">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="editArtworkDimensions" class="form-label">Dimensions</label>
                                                        <input type="text" class="form-control" id="editArtworkDimensions">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="editArtworkImageURL" class="form-label">Image URL</label>
                                                        <input type="url" class="form-control" id="editArtworkImageURL">
                                                    </div>
                                            </form>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="button" class="btn btn-danger me-auto" id="deleteArtworkBtn">Delete</button>
                                            <button type="button" class="btn btn-primary" id="updateArtworkBtn">Update Artwork</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
                            <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
                            <script src="js/main.js"></script>
